[project]
name = "qanda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Genaro", email = "genarooviedo024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.8",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "openai>=2.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
proyecto-is1-2026 = "proyecto_is1_2026:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
