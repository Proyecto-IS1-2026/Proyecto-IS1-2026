{% extends "base.html" %}
{% block title %}Registrarse - QandA{% endblock %}
{% block content %}

<h2>Crear una cuenta</h2>

<form method="POST" action="{{ url_for('auth.register') }}">

    <div>
        <label for="nombre">Nombre</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            maxlength="100"
            required
        >
    </div>

    <div>
        <label for="email">Correo electrónico</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="255"
            required
        >
    </div>

    <div>
        <label for="password">Contraseña</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >
    </div>

    <div>
        <label for="confirmar_password">
            Confirmar contraseña
        </label>
        <input
            type="password"
            id="confirmar_password"
            name="confirmar_password"
            minlength="8"
            required
        >
    </div>

    <button type="submit">Registrarme</button>

</form>

<p>
    ¿Ya tenés cuenta?
    <a href="{{ url_for('auth.login') }}">
        Iniciá sesión
    </a>
</p>

{% endblock %}
